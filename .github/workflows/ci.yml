name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  DOCKER_IMAGE: rakingbade/skyhigh-flask

jobs:
  # STAGE 1: LINT (grammar check)
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install ruff
        run: pip install ruff==0.6.9

      - name: Run linter
        run: ruff check .

  # STAGE 2: TEST (health inspector)
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: python -m pytest --cov=app --cov-report=term --junitxml=test-results.xml

      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  # STAGE 3 + 4: BUILD and PUSH the Docker image
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:v1.0.${{ github.run_number }}
            ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # STAGE 5: DEPLOY to Kubernetes (main only)
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create kind Kubernetes cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: skyhigh

      - name: Insert this run's image into the manifest
        run: |
          IMAGE="${DOCKER_IMAGE}:v1.0.${GITHUB_RUN_NUMBER}"
          sed -i "s|IMAGE_PLACEHOLDER|${IMAGE}|" k8s/deployment.yaml
          echo "Deploying image: ${IMAGE}"

      - name: Deploy to Kubernetes
        run: kubectl apply -f k8s/deployment.yaml

      - name: Wait for rollout to finish
        run: kubectl rollout status deployment/skyhigh-flask --timeout=120s

      - name: Show running pods and service
        run: kubectl get pods,svc -o wide

      - name: Smoke test the live app
        run: |
          kubectl port-forward svc/skyhigh-flask 8080:80 > /dev/null 2>&1 &
          sleep 5
          HOME_PAGE=$(curl -sf http://localhost:8080/)
          HEALTH=$(curl -sf http://localhost:8080/health)
          echo "Home page: ${HOME_PAGE}"
          echo "Health:    ${HEALTH}"
          {
            echo "## Deployment successful"
            echo "**Image:** \`${DOCKER_IMAGE}:v1.0.${GITHUB_RUN_NUMBER}\`"
            echo "**Home page:** ${HOME_PAGE}"
            echo "**Health check:** ${HEALTH}"
          } >> "$GITHUB_STEP_SUMMARY"
